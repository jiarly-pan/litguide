[project]
name = "litguide"
version = "2.0.0"
requires-python = ">=3.10"
dependencies = ["click>=8.0", "rich>=13.0", "flask>=3.0", "requests>=2.28"]

[project.scripts]
litguide = "litguide.app:main"
litguide-cli = "litguide.cli:main"
litguide-gui = "litguide.gui:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
