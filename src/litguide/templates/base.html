<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}文献检索指导系统{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme_' + theme + '.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">文献检索指导系统</div>
            <div class="nav-links">
                <a href="{{ url_for('index') }}" class="nav-link {% if request.path == '/' %}active{% endif %}">检索策略</a>
                <a href="{{ url_for('literature') }}" class="nav-link {% if request.path == '/literature' %}active{% endif %}">文献检索</a>
            </div>
            <div class="theme-switcher">
                <span class="theme-label">主题：</span>
                <select id="themeSelect" onchange="switchTheme(this.value)">
                    <option value="spring" {% if theme == 'spring' %}selected{% endif %}>浅春系</option>
                    <option value="aurore" {% if theme == 'aurore' %}selected{% endif %}>欧若风</option>
                    <option value="canele" {% if theme == 'canele' %}selected{% endif %}>可露丽风</option>
                </select>
            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="main-container">
        {% block content %}{% endblock %}
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <p>文献检索指导系统 v2.0 — 支持知网 CNKI & Web of Science 检索</p>
    </footer>

    <script>
    function switchTheme(theme) {
        fetch('/api/switch-theme', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({theme: theme})
        }).then(() => {
            window.location.reload();
        });
    }
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
